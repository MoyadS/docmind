[project]
name = "docmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MoyadS", email = "mmoyadsasa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
docmind = "docmind:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
